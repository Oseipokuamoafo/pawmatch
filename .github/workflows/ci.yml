name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: typecheck + tests + build
    runs-on: ubuntu-latest
    env:
      # The build step doesn't connect to the DB, but Prisma + NextAuth
      # require these envs to be present. None of them are real secrets.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      NEXTAUTH_SECRET: "ci-secret-not-used-anywhere-but-required"
      NEXTAUTH_URL: "http://localhost:3000"
      ENCRYPTION_KEY: "ci-encryption-key-not-used-in-real-traffic"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
